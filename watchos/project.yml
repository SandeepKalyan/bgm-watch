# XcodeGen spec: single-target, watch-only watchOS app (no iOS companion).
# Generate with:  xcodegen generate
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
# watchOS app = `type: application` + `platform: watchOS` (see XcodeGen PR #1470).
name: BGMWatch

options:
  bundleIdPrefix: com.bgmwatch
  deploymentTarget:
    watchOS: "7.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  BGMWatch:
    type: application
    platform: watchOS
    deploymentTarget: "7.0"
    sources:
      - path: BGMWatch
    info:
      # Generated by XcodeGen; kept outside BGMWatch/ so it is not copied as a resource.
      path: Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: BGM Watch
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Single-target watch app (watchOS 7+) and watch-only (no iPhone app).
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgmwatch.watch
        PRODUCT_NAME: BGMWatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Set your Team ID here, or pick the team in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
